
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Mu'rab: Klasifikasi Nahwu Klasik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pesantren: {
                            light: '#eceae0',
                            dark: '#0c0a09',
                            primary: '#4a3728',
                            secondary: '#8b7355',
                            accent: '#d4af37'
                        }
                    }
                }
            }
        }
        
        // Initialize theme before rendering to avoid flash
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease;
        }
        .arabic-text {
            font-family: 'Amiri', 'Noto Sans Arabic', serif;
            direction: rtl;
        }
        .classic-border {
            border: 2px solid #8b7355;
            box-shadow: 4px 4px 0px #8b7355;
        }
        .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
        }
        .dark .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            background-blend-mode: overlay;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
<body class="bg-pesantren-light dark:bg-pesantren-dark min-h-screen">
    <div id="root"></div>
</body>
</html>
